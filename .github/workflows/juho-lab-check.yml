name: Juho Lab checks
on:
  push:
    paths: ['projects/juho-lab/**', '.github/workflows/juho-lab-check.yml']
  pull_request:
    paths: ['projects/juho-lab/**', '.github/workflows/juho-lab-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/validate.mjs
        working-directory: projects/juho-lab
