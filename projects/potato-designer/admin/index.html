<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scene Studio · Potato Designer</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/admin/studio.css"><script type="module" src="/admin/studio.js"></script></head>
<body>
  <header class="studio-header"><div class="brand"><span class="brand-icon">p.</span><div><strong>SCENE STUDIO</strong><small>POTATO DESIGNER / 로컬 관리자</small></div></div><div class="header-actions"><span id="save-status" role="status">불러오는 중…</span><button id="undo" disabled aria-label="되돌리기">↶</button><button id="redo" disabled aria-label="다시 하기">↷</button><button id="show-changes">변경 확인</button><button id="publish" class="primary" disabled>로컬 게시</button></div></header>
  <div class="toolbar"><label>보기 <select id="page"><option value="home">홈</option><option value="work">작업 모음</option><option value="detail">작업 상세</option><option value="about">소개</option><option value="contact">프로젝트 메모</option></select></label><label>화면 <select id="viewport"><option value="base">데스크톱</option><option value="wide">와이드</option><option value="tablet">태블릿</option><option value="mobile">모바일</option></select></label><label>확대 <select id="zoom"><option value="fit">전체 맞춤</option><option value="width">너비 맞춤</option><option value="actual">100%</option></select></label><div class="mode-group" aria-label="조작 모드"><button id="edit-mode" aria-pressed="true">요소 편집</button><button id="experience-mode" aria-pressed="false">직접 체험</button></div><label class="check"><input id="show-published" type="checkbox"> 게시본 비교</label><button id="reload">다시 불러오기</button></div>
  <main class="workspace">
    <aside class="layers-panel"><div class="panel-heading"><h1>레이어</h1><span id="layer-count"></span></div><label class="sr-only" for="layer-search">레이어 검색</label><input id="layer-search" type="search" placeholder="레이어 찾기"><div id="layer-list"></div></aside>
    <section class="preview-panel" aria-label="실제 작품 미리보기"><nav id="page-sequence" aria-label="페이지 순서"></nav><div class="preview-caption"><span id="preview-label">홈 · Brand Design</span><span id="preview-size">1440 × 900</span></div><div id="preview-canvas"><div id="frame-wrap"><iframe id="preview" src="/index.html?studio=1" title="Potato Designer 실제 화면"></iframe></div></div><p id="interaction-hint">화면의 요소를 선택하고 끌어서 이동하세요. 목록에서도 레이어를 선택할 수 있습니다.</p>
      <div class="playback"><button id="play" aria-label="선택 장면의 동작 재생">▶ 재생</button><button id="restart">처음</button><label for="time">동작 시점 <output id="time-label">2.00초</output></label><input id="time" type="range" min="0" max="8000" step="10" value="2000"><label>구간 <select id="time-range"><option value="2000">2초</option><option value="8000" selected>8초</option><option value="40000">40초</option></select></label></div>
      <div class="story-heading"><strong>장면 상태</strong><span>선택해서 앞뒤 상태 확인 · 클릭 대기는 자동 진행하지 않음</span></div><div id="storyboard"></div>
    </section>
    <aside class="inspector-panel"><div class="panel-heading"><h2 id="selected-name">캐릭터</h2><button id="reset-layer">범위 초기화</button></div><div class="scope-box"><label>장면 범위<select id="scene-scope"><option value="current">현재 장면만</option><option value="all">모든 장면</option></select></label><label>화면 범위<select id="screen-scope"><option value="current">현재 화면만</option><option value="base">기본값</option></select></label><p id="scope-label"></p></div><div id="inspector"></div></aside>
  </main>
  <footer class="studio-footer"><span>편집은 초안에 저장됩니다. 로컬 게시는 이 컴퓨터의 작품 파일을 갱신합니다.</span><div><button id="import">설정 가져오기</button><input id="import-file" type="file" accept="application/json,.json" hidden><button id="export">초안 내보내기</button><button id="versions">게시 이력</button><button id="discard">게시본으로 되돌리기</button></div></footer>
  <div id="error" role="alert" hidden></div>
  <dialog id="confirm-dialog"><div class="dialog-heading"><h2 id="confirm-title">변경 확인</h2><button id="close-confirm" aria-label="닫기">×</button></div><p id="confirm-description"></p><div id="change-list"></div><div class="dialog-actions"><button id="cancel-confirm">취소</button><button id="confirm-action" class="primary">확인</button></div></dialog>
  <dialog id="versions-dialog"><div class="dialog-heading"><h2>게시 이력</h2><button id="close-versions" aria-label="게시 이력 닫기">×</button></div><p>이전 게시본을 초안으로 불러옵니다. 로컬 게시 전에는 현재 게시본이 유지됩니다.</p><div id="version-list"></div></dialog>
</body></html>
