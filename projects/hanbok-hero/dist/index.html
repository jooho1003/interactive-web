<!doctype html>
<html lang="ko" data-layer-scene="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#140f0c">
  <meta name="description" content="시·서·화를 고르면 분위기가 바뀌고, 갓 쓴 조선 선비가 시선으로 맞이하는 첫 화면.">
  <title>JOOHO LAB — 선비</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- layer-fixed: 글꼴 후보는 매니페스트 global.font·title.font 옵션과 짝이다 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Song+Myung&family=Nanum+Myeongjo:wght@400;700&display=swap">
  <link rel="stylesheet" href="./layers.css">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="stage" id="main">
    <div class="paper" aria-hidden="true">
      <img class="paper-image" data-layer-image="paper/image" src="./assets/mood-si.webp" alt="" draggable="false">
      <img class="paper-prev" alt="" draggable="false" hidden>
    </div>
    <p class="glyph" aria-hidden="true" data-layer-text="glyph/text">詩</p>
    <nav class="nav" aria-label="메뉴">
      <a href="#about" data-layer-text="nav/item1">About</a>
      <a href="#work" data-layer-text="nav/item2">Work</a>
      <a href="#contact" data-layer-text="nav/item3">Contact</a>
    </nav>
    <div class="character">
      <div class="gaze-range" aria-hidden="true"></div>
      <!-- layer-fixed: 문서 메타(title·description)와 alt는 build-layers가 src만 다시 쓰므로 바인딩하지 않는다. 정면 그림(still)을 바꾸면 alt를 손으로 고친다 -->
      <img class="character-still" data-layer-image="character/still" src="./assets/scholar-still.webp" alt="갓을 쓰고 남색 선을 두른 흰 도포를 입은 조선의 선비가 정면을 바라본다(회화풍 일러스트)" width="1440" height="1440" fetchpriority="high" draggable="false">
      <img class="character-body" data-layer-image="character/body" src="./assets/scholar-body.webp" alt="" width="1440" height="1440" draggable="false">
      <div class="character-head" aria-hidden="true"><img class="character-sheet" data-layer-image="character/sheet" src="./assets/scholar-heads.webp" alt="" draggable="false"></div>
    </div>
    <h1 class="title"><span class="title-name" data-layer-text="title/name">소운 윤하담</span><span class="title-tagline" data-layer-text="title/tagline">달을 읊고 바람을 적는 선비</span></h1>
    <div class="moods" role="group" aria-labelledby="moods-label">
      <span class="moods-label" id="moods-label" data-layer-text="moods/label">분야</span>
      <button class="mood" type="button" data-scene="si" aria-pressed="true"><span class="mood-ko" data-layer-text="moods/ko1">시</span><span class="mood-hanja" aria-hidden="true" data-layer-text="moods/hanja1">詩</span></button>
      <button class="mood" type="button" data-scene="seo" aria-pressed="false"><span class="mood-ko" data-layer-text="moods/ko2">서</span><span class="mood-hanja" aria-hidden="true" data-layer-text="moods/hanja2">書</span></button>
      <button class="mood" type="button" data-scene="hwa" aria-pressed="false"><span class="mood-ko" data-layer-text="moods/ko3">화</span><span class="mood-hanja" aria-hidden="true" data-layer-text="moods/hanja3">畫</span></button>
    </div>
    <a class="cta" href="#work" data-layer-text="cta/label">작품 보기</a>
    <p class="hint"><span class="hint-pointer" data-layer-text="hint/pointerText">마우스를 움직여 보세요</span><span class="hint-touch" data-layer-text="hint/touchText">화면을 눌러 보세요</span></p>
    <p class="credit" data-layer-text="credit/text">제작 이주호</p>
  </main>
</body>
</html>
